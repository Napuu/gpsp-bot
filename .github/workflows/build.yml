name: Build Binaries

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: 'Version to embed in the binary'
        required: false
        type: string
      retention_days:
        description: 'Number of days to retain artifacts'
        required: false
        type: number
        default: 30

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Install ffmpeg and yt-dlp
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run tests
        run: |
          go test -v ./...

      - name: Check for dead code
        run: |
          output=$(go run golang.org/x/tools/cmd/deadcode@v0.49.0 -test ./...)
          if [ -n "$output" ]; then
            echo "$output"
            echo "::error::deadcode found unreachable function(s) — remove them or wire them up"
            exit 1
          fi

  build:
    # Statically linked binaries: they carry their own libc, so the artifacts
    # run on any Linux (any Ubuntu release, Alpine, ...) regardless of the
    # host glibc version. A dynamic binary built on ubuntu-latest requires
    # that runner's glibc, which broke deployments on older Ubuntu
    # (the GLIBC_2.43 incident). No extra toolchain needed — the runner's
    # gcc plus -static does it.
    name: Build static binary for ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Install cross-compilation dependencies for arm64
        if: matrix.goarch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=$(date -u +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Build static binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc' || 'gcc' }}
          CXX: ${{ matrix.goarch == 'arm64' && 'aarch64-linux-gnu-g++' || 'g++' }}
        run: |
          go build \
            -ldflags "-linkmode external -extldflags=-static -X github.com/napuu/gpsp-bot/internal/version.Version=${{ steps.version.outputs.VERSION }}" \
            -o gpsp-bot-${{ matrix.goos }}-${{ matrix.goarch }} gpsp-bot.go

      - name: Verify static binary
        run: |
          binary=gpsp-bot-${{ matrix.goos }}-${{ matrix.goarch }}
          file "$binary"
          file "$binary" | grep -q "statically linked" || { echo "::error::$binary is not statically linked"; exit 1; }
          if readelf -d "$binary" 2>/dev/null | grep -q NEEDED; then
            echo "::error::$binary still has dynamic dependencies (NEEDED entries)"
            exit 1
          fi
          echo "OK: statically linked, no dynamic dependencies"

      - name: Smoke-test in Alpine (musl-only) container
        if: matrix.goarch == 'amd64'
        run: |
          docker run --rm -v "$PWD:/b:ro" alpine:3.22 /b/gpsp-bot-${{ matrix.goos }}-${{ matrix.goarch }} -v

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gpsp-bot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: gpsp-bot-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: ${{ inputs.retention_days || 30 }}
